<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16181d">
  <meta name="app-version" content="v1.1.0">
  <meta name="description" content="ME.CFS.report — lokale, interaktive Auswertung und konfigurierbarer Arztbericht (PDF) aus den ME/CFS-Tracker-Daten.">
  <title>ME.CFS.report</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>ME.CFS.report</h1>
      <p class="subtitle">Auswertung &amp; konfigurierbarer Arztbericht (PDF)</p>
    </div>
    <div class="import-area">
      <button class="button" id="tracker-button" type="button" title="Daten aus dem Tracker laden (gleicher Browser)">Tracker</button>
      <label class="button" for="file-input" title="CSV- oder JSON-Datei laden">CSV/JSON</label>
      <input type="file" id="file-input" accept=".csv,.json,text/csv,application/json" hidden>
      <button class="button" id="demo-button" type="button" title="Beispieldaten anzeigen">Beispiel</button>
      <button class="button button-primary" id="btn-print" type="button" title="Bericht als PDF speichern" disabled>Drucken / PDF</button>
    </div>
    <div class="import-status" id="import-status" role="status" aria-live="polite">Noch keine Daten geladen.</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Konfiguration</h2>

      <div class="cfg-group">
        <h3>Kopfdaten</h3>
        <label class="field">
          <span>Titel</span>
          <input type="text" id="cfg-title" value="ME/CFS-Verlaufsbericht">
        </label>
        <label class="field">
          <span>Patient:in</span>
          <input type="text" id="cfg-patient" placeholder="Name">
        </label>
        <label class="field">
          <span>Geburtsdatum</span>
          <input type="date" id="cfg-birthdate">
        </label>
        <label class="field">
          <span>Behandelnde:r Arzt:in</span>
          <input type="text" id="cfg-doctor" placeholder="Name">
        </label>
        <label class="field">
          <span>Freitext / Kommentar</span>
          <textarea id="cfg-note" rows="2" placeholder="z. B. Anlass des Berichts"></textarea>
        </label>
      </div>

      <div class="cfg-group">
        <h3>Zeitraum</h3>
        <div class="chip-row" id="cfg-range">
          <button type="button" class="chip is-active" data-range="all">Alle</button>
          <button type="button" class="chip" data-range="90">90 Tage</button>
          <button type="button" class="chip" data-range="30">30 Tage</button>
        </div>
      </div>

      <div class="cfg-group">
        <h3>Abschnitte</h3>
        <label class="toggle-row"><input type="checkbox" id="sec-risk" checked><span>Crash-Risiko</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-verlauf" checked><span>Verlauf</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-vergleich" checked><span>Vergleich</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-heatmap" checked><span>Heatmap</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-domaenen" checked><span>Symptombereiche</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-pem" checked><span>PEM-Episoden</span></label>
        <label class="toggle-row"><input type="checkbox" id="sec-notizen" checked><span>Notizen/Kontext</span></label>
      </div>

      <div class="cfg-group">
        <h3>Diagramme</h3>
        <div id="diagram-config"></div>
      </div>

      <div class="cfg-group">
        <h3>Layout</h3>
        <div class="cfg-sub">
          <span>Seitengröße</span>
          <div class="chip-row" id="cfg-pagesize">
            <button type="button" class="chip is-active" data-size="a4">A4</button>
            <button type="button" class="chip" data-size="letter">Letter</button>
          </div>
        </div>
        <div class="cfg-sub">
          <span>Schriftgröße</span>
          <div class="chip-row" id="cfg-fontsize">
            <button type="button" class="chip is-active" data-font="normal">Normal</button>
            <button type="button" class="chip" data-font="large">Groß</button>
          </div>
        </div>
      </div>
    </aside>

    <main class="preview">
      <div class="report-paper">
        <div class="empty-state" id="preview-empty">
          Bitte zuerst Daten laden („Tracker“, „CSV/JSON“ oder „Beispiel“).
        </div>
        <div id="preview-content" hidden></div>
      </div>
    </main>
  </div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
